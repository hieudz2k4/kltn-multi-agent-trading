[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kltn-multi-agent-trading"
version = "0.1.0"
description = "Multi-Agent Quantitative Trading System (CSR Portfolio + Multi-Asset Opportunistic SMC)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KLTN Multi-Agent Trading Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rpyc>=6.0.0",
    "fastmcp>=2.0.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "google-adk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
